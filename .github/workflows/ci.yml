name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  fast:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SPISEA
        run: pip install -e ".[dev]"

      - name: Run fast tests
        env:
          MPLBACKEND: Agg
        run: pytest spisea/tests -m "not slow" --tb=short
